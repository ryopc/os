# ===========================================================================
# Limine ブートローダー設定
#
# 早期コンソールを「シリアル (COM1)」と「VGA テキスト (0xB8000)」の
# 両方で確認できるようにするための最小構成。
# カーネルは Limine プロトコル (ELF64, x86_64) としてロードされる。
# ===========================================================================

# 起動メニューを出さず即座に既定エントリを起動する
timeout: 0

# Limine 自身のログもシリアルへ流し、カーネルログと突き合わせられるようにする
serial: yes

# グラフィックスモードを使わずテキストモードを維持する。
# これによりカーネルの VGA テキストバッファ (0xB8000) 出力が画面に現れる。
graphics: no

# ブートエントリ
/OS (x86_64)
    protocol: limine
    # ISO 内のパス。build 側でステージングされる配置に合わせる。
    # boot(): はブートデバイスのルートを指す Limine のパス接頭辞。
    kernel_path: boot():/boot/kernel.elf
    # カーネルへ渡すコマンドライン (早期コンソール設定の意図を明示)
    cmdline: console=ttyS0,115200 earlyprintk=vga
